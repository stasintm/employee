spring:
  application:
    name: employee
  datasource:
    url: jdbc:postgresql://localhost:5432/employee
    username: postgres
    password: postgres
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db.changelog-master.xml

logging:
  level:
    liquibase: DEBUG


